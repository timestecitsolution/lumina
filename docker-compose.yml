version: "3.8"

services:
  app:
    build: .
    container_name: bta_accounts
    volumes:
      - ./:/var/www/html
    ports:
      - "8083:8000"   
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: bta_accounts_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bta_accounts
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
    ports:
      - "3310:3306"  # avoid conflict if local MySQL uses 3306
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bta_accounts_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8082:80"     # phpMyAdmin at http://localhost:8082

volumes:
  db_data: